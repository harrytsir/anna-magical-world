<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="Ο Μαγικός Κόσμος της Άννας">
<meta property="og:description" content="Βασίλεια, ήρωες, πλάσματα, ιστορίες, τραγούδια και χάρτες, για μικρούς και μεγάλους.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2246%22 fill=%22%231b1d3a%22/%3E%3Cpath d=%22M50 12L58 42L88 50L58 58L50 88L42 58L12 50L42 42Z%22 fill=%22%23c9973a%22/%3E%3C/svg%3E">
<meta name="description" content="Η εγκυκλοπαίδεια του κόσμου της Άννας: βασίλεια, ήρωες, πλάσματα, ιστορίες, τραγούδια και χάρτες. Anna's Magical World, a bilingual encyclopedia.">
<title>Ο Μαγικός Κόσμος της Άννας</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Commissioner:wght@400;500;600&display=swap">
<style>
/* Layout: a codex wiki — sticky index rail on the left, reading column + portable infobox on the right; phones get a top bar and a drawer */
:root{
  --bg:#EEF0F5; --surface:#F9FAFC; --wash:#E3E6F0; --ink:#1B1D3A; --muted:#575B7C; --line:#D2D5E2;
  --gold:#8E620F; --gold-line:#C9A65E; --danger:#A8402D; --on-gold:#FFFFFF; --shade:rgba(18,19,41,.55);
  --f-display:"Alegreya SC","Palatino Linotype",Georgia,serif;
  --f-body:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:"Commissioner","Segoe UI",system-ui,sans-serif;
  --rail:248px; --measure:68ch;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121329; --surface:#1A1C37; --wash:#23264A; --ink:#E8E7F3; --muted:#A4A6C5; --line:#2E3159;
  --gold:#DDB262; --gold-line:#8C7238; --danger:#E5826C; --on-gold:#17182F; --shade:rgba(5,5,15,.62); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121329; --surface:#1A1C37; --wash:#23264A; --ink:#E8E7F3; --muted:#A4A6C5; --line:#2E3159;
  --gold:#DDB262; --gold-line:#8C7238; --danger:#E5826C; --on-gold:#17182F; --shade:rgba(5,5,15,.62); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:500;text-wrap:balance;line-height:1.15;margin:0}
.label{font-family:var(--f-ui);font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-weight:700;font-size:21px;white-space:nowrap}
.search{flex:1;min-width:0;max-width:420px;margin-left:auto;position:relative}
.search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:999px;background:var(--bg);font-family:var(--f-ui);font-size:14px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.lang button{border:0;background:none;padding:6px 10px;font-family:var(--f-ui);font-size:12px;font-weight:600;letter-spacing:.06em;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.menu-btn{display:none;border:1px solid var(--line);background:none;border-radius:8px;padding:6px 8px;cursor:pointer}

/* shell */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr)}
.rail{border-right:1px solid var(--line);padding:24px 16px 40px max(16px,env(safe-area-inset-left,0px));position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);align-self:start;max-height:calc(100vh - 57px);overflow:auto}
.rail nav{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.rail a{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:7px 10px;border-radius:6px;text-decoration:none;font-family:var(--f-ui);font-size:14.5px}
.rail a:hover{background:var(--wash)}
.rail a[aria-current="true"]{background:var(--wash);font-weight:600}
.rail a span{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.rail .sep{height:1px;background:var(--line);margin:18px 4px}
.toggle{display:flex;gap:10px;align-items:center;font-family:var(--f-ui);font-size:13.5px;color:var(--muted);padding:4px 10px;cursor:pointer}
.toggle input{accent-color:var(--gold);width:16px;height:16px;flex:none}
.rail .count{font-family:var(--f-ui);font-size:12.5px;color:var(--muted);padding:0 10px}

main{padding-block:32px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.col{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:44px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:28px;align-items:center;padding-bottom:32px;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(38px,6vw,60px);letter-spacing:.01em}
.hero p{margin:14px 0 0;max-width:54ch;color:var(--muted);font-size:18px}
.hero .stat{font-family:var(--f-ui);font-size:13px;color:var(--gold);margin-top:14px;font-weight:600;letter-spacing:.04em}
.emblem{width:100%;max-width:180px;color:var(--gold)}

/* featured */
.featured{position:relative;display:block;text-decoration:none;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.featured img{display:block;width:100%;aspect-ratio:21/9;object-fit:cover}
.featured .cap{position:absolute;inset:auto 0 0 0;padding:48px 22px 20px;background:linear-gradient(to top,var(--shade),transparent);color:#fff}
.featured .cap .label{color:#F1DDB0}
.featured .cap b{display:block;font-family:var(--f-display);font-weight:500;font-size:clamp(26px,4vw,38px);line-height:1.1;margin-top:4px;text-shadow:0 1px 12px rgba(0,0,0,.5)}
.featured .cap small{display:block;font-size:15.5px;max-width:60ch;margin-top:6px;text-shadow:0 1px 8px rgba(0,0,0,.6)}

/* section heads */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sec-h h2{font-size:28px}
.sec-h a{font-family:var(--f-ui);font-size:13.5px;color:var(--gold);text-decoration:none;font-weight:600}

/* kingdoms */
.realms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.realm{background:var(--surface);padding:16px 16px 18px;text-decoration:none;display:flex;flex-direction:column;gap:6px;min-width:0}
.realm:hover{background:var(--wash)}
.realm .num{font-family:var(--f-ui);font-size:11.5px;color:var(--gold);letter-spacing:.08em;font-variant-numeric:tabular-nums}
.realm b{font-family:var(--f-display);font-weight:500;font-size:22px;line-height:1.1}
.realm small{font-size:14.5px;color:var(--muted);line-height:1.45}
.realm img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:3px;margin-bottom:4px}

/* reading order */
.shelf{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.book{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none}
.book .n{font-family:var(--f-display);font-size:30px;color:var(--gold);line-height:1}
.book b{font-family:var(--f-display);font-weight:500;font-size:21px;display:inline;line-height:1.2}
.book small{color:var(--muted);font-size:15px;display:block}
.book:hover b{color:var(--gold)}

/* did you know */
.dyk{border-left:3px solid var(--gold-line);padding:4px 0 4px 18px;display:flex;flex-direction:column;gap:10px}
.dyk p{margin:0}
.dyk a{color:var(--gold);font-family:var(--f-ui);font-size:13px;font-weight:600;text-decoration:none;margin-left:6px}

/* generic lists */
.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.item{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);text-decoration:none;min-width:0}
.item:hover{border-color:var(--gold-line)}
.item .thumb{width:56px;height:56px;border-radius:50%;background:var(--wash);display:grid;place-items:center;font-family:var(--f-display);font-size:24px;color:var(--gold);overflow:hidden}
.item .thumb img{width:100%;height:100%;object-fit:cover}
.item b{font-family:var(--f-display);font-weight:500;font-size:19px;display:block;line-height:1.2}
.item small{color:var(--muted);font-size:14.5px;line-height:1.45;display:block;margin-top:3px}
.badge{display:inline-block;font-family:var(--f-ui);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:3px;border:1px solid var(--gold-line);color:var(--gold);margin-left:6px;vertical-align:3px;white-space:nowrap}
.group{display:flex;flex-direction:column;gap:14px}
.group h2{font-size:22px;border-bottom:1px solid var(--line);padding-bottom:6px}

/* entry */
.entry{display:flex;flex-direction:column;gap:20px}
.entry .crumbs{font-family:var(--f-ui);font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.entry .crumbs a{color:var(--gold);text-decoration:none;font-weight:600}
.entry h1{font-size:clamp(36px,5.5vw,52px)}
.entry .alt{font-family:var(--f-ui);font-size:14px;color:var(--muted);margin-top:6px}
.e-grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:32px;align-items:start}
.e-grid.solo{grid-template-columns:minmax(0,1fr)}
.e-main{min-width:0;max-width:var(--measure);display:flex;flex-direction:column;gap:20px}
.lede{font-size:20px;line-height:1.55;margin:0}
.infobox{border:1px solid var(--line);background:var(--surface);border-radius:6px;overflow:hidden;font-size:14.5px;min-width:0}
.infobox .ib-title{font-family:var(--f-display);font-size:20px;text-align:center;padding:10px 12px;background:var(--wash);line-height:1.2}
.infobox img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-block:1px solid var(--line)}
.infobox dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr)}
.infobox dt,.infobox dd{padding:8px 12px;border-top:1px solid var(--line);margin:0}
.infobox dt{font-family:var(--f-ui);font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;padding-right:6px}
.infobox dd{line-height:1.45}
.infobox a.wl{color:var(--gold);text-decoration:none}
.toc{border:1px solid var(--line);border-radius:6px;padding:12px 16px;background:var(--surface);align-self:flex-start;max-width:100%}
.toc ol{margin:6px 0 0;padding-left:20px;font-family:var(--f-ui);font-size:14px;display:flex;flex-direction:column;gap:3px}
.toc button{background:none;border:0;padding:0;color:var(--gold);cursor:pointer;text-align:left}
.toc button:hover{text-decoration:underline}
.body p{margin:0 0 1em}
.body h3{font-size:25px;margin:1.3em 0 .45em;padding-bottom:4px;border-bottom:1px solid var(--line);scroll-margin-top:80px}
.body a.wl{color:var(--gold);text-decoration:underline;text-decoration-color:var(--gold-line);text-underline-offset:3px}
.body a.wl.missing{color:var(--danger);text-decoration-style:dotted}
.body .verse{font-style:italic;padding-left:18px;border-left:2px solid var(--gold-line)}
.body ul{margin:0 0 1em;padding-left:22px}
.body li{margin-bottom:.3em}
.spoil{background:var(--wash);border-radius:3px;padding:0 3px;filter:blur(5px);cursor:pointer;transition:filter .15s}
.spoil.shown,.spoilers-on .spoil{filter:none;cursor:auto;background:none;padding:0}
.trivia{border-left:3px solid var(--gold-line);padding-left:16px;display:flex;flex-direction:column;gap:6px}
.trivia ul{margin:0;padding-left:18px}
.meta{font-family:var(--f-ui);font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding-top:16px;border-top:1px solid var(--line)}
.related{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--f-ui);font-size:13.5px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;text-decoration:none;background:var(--surface)}
.chip:hover{border-color:var(--gold-line)}
.note{font-family:var(--f-ui);font-size:13.5px;color:var(--muted);background:var(--wash);padding:10px 12px;border-radius:6px}

.veil{position:relative}
.veil .hide{filter:blur(7px);user-select:none;pointer-events:none;max-height:420px;overflow:hidden}
.veil .reveal{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px}
.veil .reveal div{background:var(--surface);border:1px solid var(--gold-line);border-radius:8px;padding:16px 18px;max-width:340px;font-family:var(--f-ui);font-size:14px}

/* buttons + forms */
.btn{font-family:var(--f-ui);font-size:14px;font-weight:600;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--gold-line)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.form{display:flex;flex-direction:column;gap:18px;max-width:820px}
.form .row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.form .langs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.form fieldset{border:1px solid var(--line);border-radius:8px;padding:14px;margin:0;display:flex;flex-direction:column;gap:12px;min-width:0}
.form legend{font-family:var(--f-ui);font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);padding:0 6px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-family:var(--f-ui);font-size:13px;font-weight:500;color:var(--muted)}
.field input[type=text],.field input[type=number],.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:15.5px}
.field textarea{font-family:var(--f-body);line-height:1.55;resize:vertical}
.help{font-family:var(--f-ui);font-size:12.5px;color:var(--muted);line-height:1.5}
.help code{background:var(--wash);padding:1px 5px;border-radius:3px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.status{font-family:var(--f-ui);font-size:13.5px;color:var(--muted)}
.status.err{color:var(--danger)}
.imgprev{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.imgprev img{max-height:90px;border-radius:4px;border:1px solid var(--line)}

.empty{border:1px dashed var(--gold-line);border-radius:8px;padding:28px 22px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;max-width:var(--measure)}
.empty h2{font-size:26px}
.empty p{margin:0;color:var(--muted)}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.gallery a{display:flex;flex-direction:column;gap:6px;text-decoration:none;font-family:var(--f-ui);font-size:13.5px}
.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px;border:1px solid var(--line)}

.readbtn{align-self:flex-start}
.contents{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.contents a{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none;align-items:baseline}
.contents a .k{font-family:var(--f-ui);font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--gold);text-transform:uppercase}
.contents a b{font-family:var(--f-display);font-weight:500;font-size:19px;line-height:1.25}
.contents a small{display:block;color:var(--muted);font-size:14.5px;line-height:1.45;margin-top:2px}
.contents a:hover b{color:var(--gold)}
.reader{max-width:64ch;margin:0 auto;display:flex;flex-direction:column;gap:18px;width:100%}
.reader .rk{font-family:var(--f-ui);font-size:12.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);text-align:center}
.reader h1{font-size:clamp(32px,5vw,46px);text-align:center}
.reader .orn{text-align:center;color:var(--gold);letter-spacing:.5em;margin:6px 0}
.reader .text{font-size:18.5px;line-height:1.75}
.reader .text p{margin:0 0 .95em;text-indent:1.4em}
.reader .text p.first,.reader .text p.v{text-indent:0}
.reader .text p.v{font-style:italic;padding-left:1.4em;margin:0 0 .2em}
.reader .text .orn+p,.reader .text h3.rh+p{text-indent:0}
.reader .text h3.rh{font-size:26px;margin:1.6em 0 .7em;text-align:center}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid var(--line);padding-top:16px;font-family:var(--f-ui)}
.pager a{display:flex;flex-direction:column;gap:2px;text-decoration:none;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:0}
.pager a:hover{border-color:var(--gold-line)}
.pager a.next{text-align:right;grid-column:2}
.pager small{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pager b{font-family:var(--f-display);font-weight:500;font-size:17px;line-height:1.25}
.badge.exp{border-style:dashed;color:var(--muted);border-color:var(--muted)}
.map{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--wash)}
.map svg{display:block;width:100%;height:auto}
.map .sea{fill:var(--wash)}
.map .land{fill:var(--surface);stroke:var(--gold-line);stroke-width:1.2}
.map .mtn{fill:none;stroke:var(--muted);stroke-width:1.1;stroke-linejoin:round;opacity:.7}
.map .tree{fill:var(--muted);opacity:.32}
.map .river{fill:none;stroke:var(--gold-line);stroke-width:2;opacity:.9}
.map .wave{fill:none;stroke:var(--muted);stroke-width:1;opacity:.35}
.map a text{font-family:var(--f-display);font-size:19px;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.map a:hover text,.map a:focus text{fill:var(--gold)}
.map a circle{fill:var(--gold)}
.map .minor{font-family:var(--f-ui);font-size:12px;fill:var(--muted);font-style:italic}
.map-note{font-family:var(--f-ui);font-size:12.5px;color:var(--muted);margin:8px 0 0}
@media (max-width:1100px){.e-grid{grid-template-columns:minmax(0,1fr)}.e-grid .infobox{order:-1;max-width:420px}}
@media (max-width:860px){
  :root{--rail:0px}
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;left:0;top:calc(env(safe-area-inset-top,0px) + 57px);bottom:0;width:min(290px,86vw);max-height:none;background:var(--surface);z-index:8;transform:translateX(-105%);transition:transform .2s ease;border-right:1px solid var(--line);padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
  .rail.open{transform:none;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  .menu-btn{display:inline-flex}
  .realms,.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}
  .list{grid-template-columns:minmax(0,1fr)}
  .hero{grid-template-columns:minmax(0,1fr) 110px}
  .featured img{aspect-ratio:16/10}
}
@media (max-width:560px){
  .brand b{display:none}
  .hero{grid-template-columns:minmax(0,1fr)}
  .emblem{max-width:120px}
  .realms{grid-template-columns:minmax(0,1fr)}

         help:"Σύνδεσμος: <code>[[Μιθλόρια]]</code> ή <code>[[Μιθλόρια|το βασίλειο]]</code>. Κενή γραμμή = νέα παράγραφος. <code>## </code> = υπότιτλος. <code>&gt; </code> = στίχος. <code>- </code> = κουκκίδα. <code>**έντονα**</code>, <code>*πλάγια*</code>. Κρυφή αποκάλυψη μέσα στο κείμενο: <code>||κείμενο||</code>.",

  en:{brand:"Anna's Magical World",index:"Index",search:"Search the world…",home:"Home",

/* ---------- state ---------- */
const S={entries:new Map(),lang:"el",spoilers:false,loaded:false,dbOk:null,canEdit:false,db:null,assets:null,editing:null,draftImage:null,confirmDel:false,revealed:new Set(),texts:new Map()};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const t=()=>T[S.lang];
try{const l=localStorage.getItem("nk.lang");if(l==="en"||l==="el")S.lang=l;S.spoilers=localStorage.getItem("nk.spoil")==="1";}catch(e){}

function tx(e,field){const a=e[S.lang]||{},b=e[S.lang==="el"?"en":"el"]||{};return (a[field]&&String(a[field]).trim())?a[field]:(b[field]||"");}
function hasLang(e,l,f){return !!(e[l]&&e[l][f||"title"]&&String(e[l][f||"title"]).trim());}
function catName(id){const c=CATS.find(c=>c.id===id);return c?c[S.lang]:id;}
function imgUrl(id){return id?"img/"+encodeURIComponent(id)+".jpg":"";}
function ord(e){return typeof e.order==="number"?e.order:999;}
function sorted(list){return list.sort((a,b)=>(ord(a)-ord(b))||tx(a,"title").localeCompare(tx(b,"title"),S.lang));}
function visible(e){return S.spoilers||!e.spoiler;}
function inCat(c){return sorted([...S.entries.values()].filter(e=>e.cat===c));}
function initial(e){return (tx(e,"title")||"?").trim().charAt(0);}
function bi(s){s=String(s??"");const i=s.indexOf(" // ");if(i<0)return s;return S.lang==="en"?s.slice(i+4):s.slice(0,i);}
function lbl(k){return S.lang==="en"&&LBL[k]?LBL[k]:k;}
function daySeed(n){const d=new Date();let x=d.getFullYear()*372+d.getMonth()*31+d.getDate()+n*97;x=(x*2654435761)>>>0;return x;}

/* ---------- emblem: nine points joined as a {9/4} star ---------- */
function emblem(){
  const P=[],R=74;for(let i=0;i<9;i++){const a=(i*40-90)*Math.PI/180;P.push([100+R*Math.cos(a),100+R*Math.sin(a)]);}
  let star="";for(let i=0;i<9;i++){const p=P[(i*4)%9];star+=(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1);}star+="Z";
  let s=`<circle cx="100" cy="100" r="${R+10}" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"/><circle cx="100" cy="100" r="${R+15}" fill="none" stroke="currentColor" stroke-width=".6" opacity=".4"/><path d="${star}" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>`;
  P.forEach(p=>{s+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.2" fill="currentColor"/>`;});
  return s+`<circle cx="100" cy="100" r="5" fill="currentColor"/>`;
}
$("#miniEmblem").innerHTML=emblem();$("#miniEmblem").style.color="var(--gold)";

/* ---------- light markup ---------- */
function findByRef(ref){
  const r=ref.trim();if(S.entries.has(r))return S.entries.get(r);
  const low=r.toLocaleLowerCase();
  for(const e of S.entries.values()){for(const l of ["el","en"]){if(e[l]&&e[l].title&&e[l].title.trim().toLocaleLowerCase()===low)return e;}}
  for(const e of S.entries.values()){if(Array.isArray(e.aka)&&e.aka.some(a=>String(a).toLocaleLowerCase()===low))return e;}
  return null;
}
function inline(s){
  let h=esc(s);
  h=h.replace(/\|\|(.+?)\|\|/g,(m,x)=>`<span class="spoil" tabindex="0" role="button" title="${esc(t().spoilerBadge)}">${x}</span>`);
  h=h.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,ref,label)=>{
    const raw=ref.replace(/&amp;/g,"&").replace(/&#39;/g,"'").replace(/&quot;/g,'"');
    const e=findByRef(raw);const text=label||ref;
    return e?`<a class="wl" href="#e-${esc(e.id)}">${text}</a>`:`<a class="wl missing" href="#new" data-new="${ref}">${text}</a>`;
  });
  return h.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>");
}
function render(body,heads){
  if(!body)return"";let n=0;
  const kind=l=>/^##\s+/.test(l)?"h":/^>/.test(l)?"v":/^-\s+/.test(l)?"u":"p";
  return String(body).replace(/\r/g,"").split(/\n\s*\n/).map(block=>{
    const lines=block.split("\n").filter(l=>l.trim().length);const groups=[];
    lines.forEach(l=>{const k=kind(l),g=groups[groups.length-1];if(k!=="h"&&g&&g.k===k)g.ls.push(l);else groups.push({k,ls:[l]});});
    return groups.map(g=>{
      if(g.k==="h"){const txt=g.ls[0].replace(/^##\s+/,"");if(heads)heads.push(txt);return `<h3 id="sec-${n++}">${inline(txt)}</h3>`;}
      if(g.k==="v")return `<p class="verse">${g.ls.map(l=>{const x=l.replace(/^>\s?/,"");return x.trim()?inline(x):'<span class="stanza"></span>';}).join("<br>")}</p>`;
      if(g.k==="u")return `<ul>${g.ls.map(l=>`<li>${inline(l.replace(/^-\s+/,""))}</li>`).join("")}</ul>`;
      return `<p>${g.ls.map(inline).join("<br>")}</p>`;}).join("");
  }).join("");
}
function linksOut(e){
  const out=new Set();const txt=[e.el&&e.el.body,e.en&&e.en.body,(e.info||[]).map(r=>r[1]).join(" ")].join("\n");
  (txt.match(/\[\[([^\]|]+)/g)||[]).forEach(m=>{const f=findByRef(m.slice(2));if(f&&f.id!==e.id)out.add(f.id);});
  return [...out];
}

/* ---------- chrome ---------- */
function paintChrome(){
  document.documentElement.lang=S.lang;
  document.body.classList.toggle("spoilers-on",S.spoilers);
  $("#lang-el").setAttribute("aria-pressed",S.lang==="el");$("#lang-en").setAttribute("aria-pressed",S.lang==="en");
  $("#brandName").textContent=t().brand;$("#railLabel").textContent=t().index;$("#q").placeholder=t().search;
  $("#spoilerLabel").textContent=t().spoil;$("#spoilers").checked=S.spoilers;
  const route=location.hash.slice(1)||"home";
  let nav=`<a href="#home" ${route==="home"?'aria-current="true"':""}>${esc(t().home)}</a>`;
  CATS.filter(c=>!c.hidden).forEach(c=>{const n=[...S.entries.values()].filter(e=>e.cat===c.id&&visible(e)).length;
    nav+=`<a href="#c-${c.id}" ${route==="c-"+c.id?'aria-current="true"':""}>${esc(c[S.lang])}<span>${n||""}</span></a>`;});
  $("#nav").innerHTML=nav;
  $("#editorSlot").innerHTML=S.canEdit&&S.dbOk?`<div class="sep"></div><div class="label" style="padding:0 10px 8px">${esc(t().editorMode)}</div><a class="btn primary" style="margin:0 10px" href="#new">+ ${esc(t().newE)}</a>`:"";
}

/* ---------- views ---------- */
function toRoman(n){return ["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII"][n-1]||String(n);}
function shelfRow(e){const n=ord(e)<90?ord(e):"✦";
  return `<a class="book" href="#e-${esc(e.id)}"><span class="n">${n}</span><span><b>${esc(tx(e,"title"))}</b>${e.badge?`<span class="badge">${esc(e.badge)}</span>`:""}<small>${esc(tx(e,"summary"))}</small></span></a>`;}
function realmCard(e,i){return `<a class="realm" href="#e-${esc(e.id)}">${e.image?`<img src="${imgUrl(e.image)}" alt="" loading="lazy">`:""}<span class="num">${toRoman(i+1)}</span><b>${esc(tx(e,"title"))}</b><small>${esc(tx(e,"summary"))}</small></a>`;}
function card(e){
  return `<a class="item" href="#e-${esc(e.id)}"><span class="thumb">${e.image?`<img src="${imgUrl(e.image)}" alt="" loading="lazy">`:esc(initial(e))}</span><span><b>${esc(tx(e,"title"))}${e.spoiler?`<span class="badge">${esc(t().spoilerBadge)}</span>`:""}${e.badge?`<span class="badge">${esc(e.badge)}</span>`:""}${expBadge(e)}</b><small>${esc(tx(e,"summary"))}</small></span></a>`;
}
function expBadge(e){return S.canEdit&&e.exp?`<span class="badge exp" title="${esc(t().expanded)}">${esc(t().expanded)}</span>`:"";}
function storiesOf(bookId){return sorted([...S.entries.values()].filter(x=>x.cat==="stories"&&x.book===bookId));}
function contentsList(list){
  return `<div class="contents">${list.map(s=>`<a href="#e-${esc(s.id)}"><span class="k">${esc(bi(s.kicker)||String(ord(s)))}</span><span><b>${esc(tx(s,"title"))}</b><small>${esc(tx(s,"summary"))}</small></span></a>`).join("")}</div>`;
}
function vHome(){
  const all=[...S.entries.values()];
  let h=`<section class="hero"><div><div class="label">Fanpedia</div><h1 style="margin-top:8px">${esc(t().brand)}</h1><p>${esc(t().heroP)}</p>${S.loaded&&all.length?`<div class="stat">${all.filter(visible).length} ${esc(t().entries)}</div>`:""}</div>
    <svg class="emblem" viewBox="0 0 200 200" role="img" aria-label="${esc(t().realms)}">${emblem()}</svg></section>`;
  if(!S.loaded)return h+`<p class="status">${esc(S.dbOk===false?t().noDb:t().loading)}</p>`;
  if(!all.length)return h+emptyState();
  const pics=sorted(all.filter(e=>e.image&&visible(e)));
  if(pics.length){const f=pics[daySeed(1)%pics.length];
    h+=`<a class="featured" href="#e-${esc(f.id)}"><img src="${imgUrl(f.image)}" alt=""><span class="cap"><span class="label">${esc(t().featured)}</span><b>${esc(tx(f,"title"))}</b><small>${esc(tx(f,"summary"))}</small></span></a>`;}
  const realms=inCat("kingdoms");
  if(realms.length)h+=`<section><div class="sec-h"><h2>${esc(t().realms)}</h2><a href="#c-kingdoms">${esc(t().all)} →</a></div><div class="realms">${realms.map(realmCard).join("")}</div></section>`;
  const books=inCat("books");
  if(books.length)h+=`<section><div class="sec-h"><h2>${esc(t().readOrder)}</h2><a href="#c-books">${esc(t().all)} →</a></div><div class="shelf">${books.map(shelfRow).join("")}</div></section>`;

/* ---------- router ---------- */
let pendingPreset=null,lastRoute="";
function route(){
  const r=location.hash.slice(1)||"home";
  if(!r.startsWith("edit-")&&r!=="new")S.editing=null;
  const q=$("#q").value.trim();let html;
  if(r==="search"&&q)html=vSearch(q);
  else if(r==="home"||r==="search")html=vHome();
  else if(r.startsWith("c-"))html=vCat(r.slice(2));
  else if(r.startsWith("e-"))html=vEntry(r.slice(2));
  else if(r.startsWith("r-"))html=vRead(r.slice(2));
  else if(r==="new")html=vEdit(null,pendingPreset);
  else if(r.startsWith("edit-"))html=vEdit(r.slice(5));
  else html=vMissing();
  const keep=$("#editForm")&&(r==="new"||r.startsWith("edit-"))?[...document.querySelectorAll("#editForm [id]")].reduce((m,el)=>{if("value" in el)m[el.id]=el.type==="checkbox"?el.checked:el.value;return m;},{}):null;
  $("#view").innerHTML=html;
  if(keep)for(const k in keep){const el=document.getElementById(k);if(el&&k!=="f-file"){if(el.type==="checkbox")el.checked=keep[k];else el.value=keep[k];}}
  if($("#editForm")){paintImg();paintDel();}
  paintChrome();
}
window.addEventListener("hashchange",()=>{const r=location.hash.slice(1);if(r!==lastRoute){lastRoute=r;if(r!=="search")window.scrollTo(0,0);}$("#rail").classList.remove("open");$("#menuBtn").setAttribute("aria-expanded","false");route();});

/* ---------- events ---------- */
document.addEventListener("click",ev=>{
  const sp=ev.target.closest(".spoil");if(sp&&!S.spoilers){sp.classList.add("shown");return;}
  const a=ev.target.closest("[data-new],[data-cat],[data-reveal],[data-jump],#lang-el,#lang-en,#f-noimg,#f-del,#f-del-yes,#f-del-no,#menuBtn");
  if(!a)return;
  if(a.dataset.jump){document.getElementById(a.dataset.jump)?.scrollIntoView({behavior:"smooth",block:"start"});return;}
  if(a.id==="lang-el"||a.id==="lang-en"){S.lang=a.id.slice(5);try{localStorage.setItem("nk.lang",S.lang)}catch(e){}route();return;}
  if(a.id==="menuBtn"){const o=$("#rail").classList.toggle("open");a.setAttribute("aria-expanded",o);return;}
  if(a.dataset.reveal){S.revealed.add(a.dataset.reveal);route();return;}
  if(a.dataset.new!==undefined||a.dataset.cat){
    if(!S.canEdit){ev.preventDefault();return;}
    pendingPreset={title:a.dataset.new||"",cat:a.dataset.cat||"characters"};S.editing=null;
    if(location.hash==="#new"){ev.preventDefault();route();}return;
  }
  if(a.id==="f-noimg"){S.draftImage="";paintImg();return;}
  if(a.id==="f-del"){S.confirmDel=true;paintDel();return;}
  if(a.id==="f-del-no"){S.confirmDel=false;paintDel();return;}
  if(a.id==="f-del-yes"){const id=location.hash.slice(6);const cat=S.entries.get(id)?.cat;a.disabled=true;
    S.db.collection("entries").doc(id).delete().then(()=>{S.editing=null;location.hash=cat?"#c-"+cat:"#home";})
      .catch(()=>{a.disabled=false;const st=$("#f-status");st.textContent=t().f.failSave;st.className="status err";});}
});
document.addEventListener("keydown",ev=>{if((ev.key==="Enter"||ev.key===" ")&&ev.target.classList?.contains("spoil")){ev.preventDefault();ev.target.classList.add("shown");}});
document.addEventListener("change",async ev=>{
  if(ev.target.id==="spoilers"){S.spoilers=ev.target.checked;try{localStorage.setItem("nk.spoil",S.spoilers?"1":"0")}catch(e){}route();return;}
  if(ev.target.id==="f-file"&&ev.target.files[0]&&S.assets){
    const st=$("#f-status");st.className="status";st.textContent=t().f.uploading;
    try{const r=await S.assets.upload(ev.target.files[0]);S.draftImage=r.id;st.textContent="";paintImg();}
    catch(e){st.textContent=t().f.failUp;st.className="status err";}
  }
});
document.addEventListener("submit",async ev=>{
  if(ev.target.id!=="editForm")return;ev.preventDefault();
  const st=$("#f-status"),btn=$("#f-save"),f=t().f;const d=readForm();
  if(!d.el.title&&!d.en.title){st.textContent=f.needTitle;st.className="status err";return;}
  const r=location.hash.slice(1);const id=r.startsWith("edit-")?r.slice(5):slugId(d);
  d.updatedAt=Date.now();
  btn.disabled=true;st.className="status";st.textContent=f.saving;
  try{await S.db.collection("entries").doc(id).set(d);S.editing=null;pendingPreset=null;location.hash="#e-"+id;}
  catch(e){btn.disabled=false;st.textContent=f.failSave;st.className="status err";}
});
let qTimer;
$("#q").addEventListener("input",()=>{clearTimeout(qTimer);qTimer=setTimeout(()=>{const q=$("#q").value.trim();
  if(q){if(location.hash!=="#search")location.hash="#search";else route();}else if(location.hash==="#search")location.hash="#home";},180);});

/* ---------- boot ---------- */
route();
(async()=>{
  try{const r=await fetch("data/entries.json",{cache:"no-cache"});const list=await r.json();
    const m=new Map();list.forEach(v=>{if(v&&v.id)m.set(v.id,v);});S.entries=m;S.loaded=true;S.dbOk=true;}
  catch(e){S.dbOk=false;}
  route();
})();
})();
</script>
